spring.application.name=backend


# Environment variables are loaded from .env by the spring-dotenv library (me.paulschwarz:spring-dotenv).
# For local development copy .env.example to .env and fill in your values.


# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=VGhpc0lzQVNlY3JldEtleUZvclNoaXBUcmFja1Byb0pXVEF1dGhlbnRpY2F0aW9uMTIzNDU2
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

spring.security.oauth2.client.provider.google.authorization-uri=${GOOGLE_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
spring.security.oauth2.client.provider.google.token-uri=${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
spring.security.oauth2.client.provider.google.user-info-uri=${GOOGLE_USERINFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
spring.security.oauth2.client.provider.google.user-name-attribute=${GOOGLE_USERNAME_ATTRIBUTE:sub}

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.org.springframework.security=DEBUG

# Delay Prediction
app.delay-prediction.medium-threshold-minutes=20
app.delay-prediction.high-threshold-minutes=60

app.delay-prediction.low-traffic-speed-kmh=50
app.delay-prediction.medium-traffic-speed-kmh=30
app.delay-prediction.high-traffic-speed-kmh=15

app.delay-prediction.rain-delay-minutes=15
app.delay-prediction.fog-delay-minutes=20
app.delay-prediction.storm-delay-minutes=40
app.delay-prediction.snow-delay-minutes=35
